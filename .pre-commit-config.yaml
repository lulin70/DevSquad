# Pre-commit hooks for DevSquad
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Mirrors CI checks in .github/workflows/test.yml (lint job) so that
# locally-caught issues never reach CI. Fast hooks run first; slow mypy
# runs last and only on staged files.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(scripts|skills|tests)/.*\.py$
      - id: ruff-format
        files: ^(scripts|skills|tests)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$|^docs/
      - id: end-of-file-fixer
        exclude: \.md$|^docs/
      - id: check-yaml
        files: \.(yaml|yml)$
        # deployment.yaml uses ${ENV_VAR} placeholders that are not template syntax
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: fix-encoding-pragma
        args: [--remove]

  - repo: local
    hooks:
      # Blocking mypy on scripts/ and skills/ (matches CI lint job)
      - id: mypy
        name: mypy (scripts/ and skills/)
        entry: mypy
        language: system
        types: [python]
        files: ^(scripts|skills)/.*\.py$
        args: [--ignore-missing-imports, --no-error-summary]
        pass_filenames: false
        # Run on the whole packages, not just staged files (cross-file type flow)
        additional_dependencies: []

      # Version consistency check (catch version drift before commit)
      - id: version-consistency
        name: version consistency
        entry: python scripts/check_version_consistency.py
        language: system
        files: ^(scripts/collaboration/_version\.py|pyproject\.toml|scripts/check_version_consistency\.py)$
        pass_filenames: false

      # Dependency lock consistency check (ROADMAP P2-4: prevent CI drift
      # from stale pre-commit hook versions — project_memory: "pre-commit
      # hooks 版本陈旧是 CI 漂移的根本原因").
      - id: dependency-lock-check
        name: dependency lock consistency
        entry: python scripts/check_dependency_lock.py
        language: system
        files: ^(\.pre-commit-config\.yaml|requirements-dev\.lock|scripts/check_dependency_lock\.py)$
        pass_filenames: false

      # Todo drift monitor (V4.3.0 P0-2): block unregistered tech debt.
      # Scans scripts/ for new TODO/FIXME/HACK/XXX/WIP/待办/待修复 markers
      # not registered in docs/TECH_DEBT.md. Uses tokenize-based comment
      # detection to avoid false positives from string literals.
      - id: todo-drift-monitor
        name: todo drift monitor
        entry: python scripts/collaboration/todo_drift_monitor.py
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: false
        always_run: true
