name: devsquad-gate (dogfood)

# V4.8.0 P1-R1 T-2 (dogfood): this repository consumes its own published
# gate exactly as an external consumer would — the same @v4.8.0 tag ref,
# the same pinned PyPI install, and the same reusable-workflow call shape
# documented in QUICKSTART channel C. Every PR here now gets the same
# deterministic review an external repository gets.
#
# tests/** is excluded: this repository's test fixtures legitimately carry
# the anti-pattern words and debug calls as data — they exercise the very
# regexes the gate itself runs. Scanning them would produce pattern matches
# that are technically correct but wrong as product judgments.
# Markdown docs need no exclusion: the review filter already drops
# unreviewable file types (unsupported_ext gate).

on:
  pull_request:

jobs:
  devsquad-gate:
    uses: lulin70/DevSquad/.github/workflows/devsquad-gate.yml@v4.8.0
    with:
      exclude: "tests/**"
    permissions:
      contents: read
      pull-requests: write
