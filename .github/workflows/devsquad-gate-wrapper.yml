name: devsquad-gate (dogfood)

# V4.8.0 P1-R1 T-2 (dogfood): this repository consumes its own published
# gate exactly as an external consumer would — the same @v4.9.0 tag ref,
# the same pinned PyPI install, and the same reusable-workflow call shape
# documented in QUICKSTART channel C. Every PR here now gets the same
# deterministic review an external repository gets.
#
# v4.9.0 bump (defect-ledger MINOR): the wrapper moves to the @v4.9.0 tag
# so the dogfood gate runs the published 4.9.0 scanner — the release that
# ships the W1-W4 defect-ledger batch (ledger core, signal write-side,
# registration gate, feature gate). The reusable gate workflow itself
# also gained its 4.9.0 default version in PR #86; every PR of this
# repository is now reviewed with the published 4.9.0 gate in the loop.
#
# v4.8.2 bump (print_debug CLI-layer verification): the wrapper moved to
# the @v4.8.2 tag so the dogfood gate exercised the fixed scanner in
# production — the print_debug false positives the 4.8.1 gate raised on
# PR #71's CLI command modules are gone in 4.8.2 (PR #72), and every PR of
# this repository is re-checked with that fix in the loop.
#
# v4.8.1 bump (F-D1 verification): the wrapper moved to the @v4.8.1 tag so
# the dogfood gate exercised the fixed diff-pattern path gates in
# production — the same F-D1 defect class the 4.8.0 gate surfaced on PR #62
# is now re-checked against every PR of this repository.
#
# tests/** is excluded: this repository's test fixtures legitimately carry
# the anti-pattern words and debug calls as data — they exercise the very
# regexes the gate itself runs. Scanning them would produce pattern matches
# that are technically correct but wrong as product judgments.
# docs/e2e_evidence/** is excluded (2026-10-27, W3 dogfood finding, PR #84):
# e2e runner scripts print their assertion results to stdout — that stdout
# IS the runner's product interface (same judgment class as the V4.8.2
# print_debug CLI-layer exemption, PR #72; the R4 check_script.py precedent
# already carries prints in main). Real secret leaks in those paths stay
# covered by the dedicated "No secrets in repo" CI job, which scans the
# whole tree independently of this gate.
# Markdown docs need no exclusion for code-smell findings with devsquad
# >= 4.8.1: those findings come from source-kind files only (F-D1, fixed
# in 4.8.1 — under 4.8.0 the diff pattern scan filtered nothing); secret
# findings are still checked in documents (a real key in a doc is a leak).

on:
  pull_request:

jobs:
  devsquad-gate:
    uses: lulin70/DevSquad/.github/workflows/devsquad-gate.yml@v4.9.0
    with:
      exclude: "tests/**,docs/e2e_evidence/**"
    permissions:
      contents: read
      pull-requests: write
