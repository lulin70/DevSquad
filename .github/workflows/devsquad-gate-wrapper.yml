name: devsquad-gate (dogfood)

# V4.8.0 P1-R1 T-2 (dogfood): this repository consumes its own published
# gate exactly as an external consumer would — the same @v4.8.1 tag ref,
# the same pinned PyPI install, and the same reusable-workflow call shape
# documented in QUICKSTART channel C. Every PR here now gets the same
# deterministic review an external repository gets.
#
# v4.8.1 bump (F-D1 verification): the wrapper moves to the @v4.8.1 tag so
# the dogfood gate exercises the fixed diff-pattern path gates in
# production — the same F-D1 defect class the 4.8.0 gate surfaced on PR #62
# is now re-checked against every PR of this repository.
#
# tests/** is excluded: this repository's test fixtures legitimately carry
# the anti-pattern words and debug calls as data — they exercise the very
# regexes the gate itself runs. Scanning them would produce pattern matches
# that are technically correct but wrong as product judgments.
# Markdown docs need no exclusion for code-smell findings with devsquad
# >= 4.8.1: those findings come from source-kind files only (F-D1, fixed
# in 4.8.1 — under 4.8.0 the diff pattern scan filtered nothing); secret
# findings are still checked in documents (a real key in a doc is a leak).

on:
  pull_request:

jobs:
  devsquad-gate:
    uses: lulin70/DevSquad/.github/workflows/devsquad-gate.yml@v4.8.1
    with:
      exclude: "tests/**"
    permissions:
      contents: read
      pull-requests: write
