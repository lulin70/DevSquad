name: V4.5.9 Release E2E

# Reusable release-tag E2E gate.
# The release workflow calls this workflow before publishing to PyPI.
# It can also be run manually for release validation.

on:
  workflow_call:
    secrets:
      DEVSQUAD_OPENAI_API_KEY:
        required: false
      DEVSQUAD_OPENAI_BASE_URL:
        required: false
      DEVSQUAD_OPENAI_MODEL:
        required: false
      DEVSQUAD_ANTHROPIC_API_KEY:
        required: false
      MOKA_API_KEY:
        required: false
      MOKA_API_BASE:
        required: false
      MOKA_MODEL:
        required: false
  workflow_dispatch:
    inputs:
      skip_real_llm:
        description: "Skip real LLM E2E (use only for local debugging)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-bridge-e2e:
    name: Host Bridge E2E (FakeHostRunner subprocess)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVSQUAD_LLM_BACKEND: auto
      DEVSQUAD_API_AUTH_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-timeout

      - name: Run Host Bridge E2E
        # 7 cases covering: success round-trip, failure, timeout, fuse skip,
        # create_backend host path, marker corruption, auto-fallback no-host
        run: |
          python -m pytest tests/e2e/test_host_bridge_e2e.py \
            -v --tb=short --timeout=300 -m "e2e"

      - name: Run user journey E2E
        # 12 cases covering: S/M/L routing, sequential vs parallel, B/A/C paths,
        # report visibility, no-secrets-in-logs, dry-run
        run: |
          python -m pytest tests/e2e/test_user_journey_dispatch.py \
            -v --tb=short --timeout=60 -m "e2e"

      - name: Run V4.5.9 CLI subprocess user journeys
        # Real user simulation: launch the executable in a separate process,
        # validate argument parsing, exit code, JSON output, and env behavior.
        run: |
          python -m pytest tests/e2e/test_v459_cli_subprocess_journey.py \
            -v --tb=short --timeout=60 -m "e2e"

      - name: Run anti-ghost verification
        # Ensures all 11 V4.5.3 modules' _call_counter > 0
        # V4.5.3 adds: ArtifactStore / EffectRegistry / AuditCLI
        run: |
          python scripts/check_module_activation.py

  real-llm-e2e:
    name: Real LLM E2E (conditional release check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: host-bridge-e2e
    # Run on tag pushes and reusable-workflow calls; manual runs may opt out.
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_real_llm
    env:
      DEVSQUAD_LLM_BACKEND: auto
      DEVSQUAD_API_AUTH_DISABLED: "1"
      DEVSQUAD_OPENAI_API_KEY: ${{ secrets.DEVSQUAD_OPENAI_API_KEY }}
      DEVSQUAD_OPENAI_BASE_URL: ${{ secrets.DEVSQUAD_OPENAI_BASE_URL }}
      DEVSQUAD_OPENAI_MODEL: ${{ secrets.DEVSQUAD_OPENAI_MODEL }}
      MOKA_API_KEY: ${{ secrets.MOKA_API_KEY }}
      MOKA_API_BASE: ${{ secrets.MOKA_API_BASE }}
      MOKA_MODEL: ${{ secrets.MOKA_MODEL }}
      DEVSQUAD_ANTHROPIC_API_KEY: ${{ secrets.DEVSQUAD_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-timeout openai anthropic
      - name: Run real LLM E2E when credentials are configured
        if: env.DEVSQUAD_OPENAI_API_KEY != '' || env.DEVSQUAD_ANTHROPIC_API_KEY != ''
        run: |
          python -m pytest tests/external/test_real_llm.py \
            -v --tb=short --timeout=120 -m "external"
        continue-on-error: true
      - name: Record external E2E skip when credentials are absent
        if: env.DEVSQUAD_OPENAI_API_KEY == '' && env.DEVSQUAD_ANTHROPIC_API_KEY == ''
        run: echo "External LLM E2E skipped — no provider credentials configured"

  final-gate:
    name: V4.5.16 Final Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [host-bridge-e2e]  # real-llm-e2e is conditional and not a hard gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Full regression suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio pytest-timeout httpx2 mcp openai anthropic streamlit Pillow fakeredis redis
      - name: Run all unit + integration + contract (no external)
        run: |
          python -m pytest tests/unit/ tests/integration/ tests/contract/ \
            tests/test_*.py tests/security/ \
            --ignore=tests/e2e \
            --ignore=tests/external \
            -q --tb=short --timeout=60
      - name: Validate baseline file present
        run: |
          test -f docs/reference/PERFORMANCE_BASELINE.json || (
            echo "ERROR: PERFORMANCE_BASELINE.json missing"
            exit 1
          )
      - name: Validate test plan + baseline doc consistency
        run: |
          python scripts/check_version_consistency.py --strict
