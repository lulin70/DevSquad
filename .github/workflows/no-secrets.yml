name: No Secrets (V4.5.2 §8)

# V4.5.2 Secret Leak Prevention — blocks PRs that contain real API keys.
#
# Detection: tests/security/test_no_secrets_in_repo.py scans scripts/, docs/,
# tests/ for known secret prefixes (sk-, sk-ant-, gsk_, AIza, ghp_, xox-, AKIA).
#
# Coverage:
#   - Real API keys: openai/anthropic/groq/google/github/slack/aws
#   - Placeholders (sk-test, fake, mock, example, ${VAR}, os.environ[X]) are allowed
#   - Whitelist: .git/, __pycache__/, docs/_archive/, tests/fakes/, tests/security/
#
# Block behavior:
#   - PR to main: BLOCK on any real-key hit
#   - Push to main: BLOCK
#   - Schedule (daily 4AM UTC): BLOCK + email report (via workflow_dispatch failure)
#
# Related: gitleaks runs in test.yml::security for additional defense-in-depth.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"  # Daily at 4AM UTC (after perf-baseline)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-secrets-scan:
    name: No secrets in repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Scan all of working tree (not just HEAD)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run no-secrets scan
        # All 29 cases in test_no_secrets_in_repo.py
        # Most important: test_full_repo_scan_no_secrets
        run: |
          python -m pytest tests/security/test_no_secrets_in_repo.py \
            -v --tb=short --timeout=60 -m "security"

      - name: Verify full repo scan (informational)
        run: |
          # Explicit smoke test of the most critical case
          python -m pytest tests/security/test_no_secrets_in_repo.py::TestNoSecrets::test_full_repo_scan_no_secrets \
            -v --tb=long --timeout=60

      - name: Upload scan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-failure
          path: |
            tests/security/test_no_secrets_in_repo.py
          retention-days: 30
