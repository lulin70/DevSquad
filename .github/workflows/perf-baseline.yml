name: Perf Baseline (V4.5.2)

# V4.5.2 Performance Baseline CI Gate.
#
# Runs on:
#   - PRs to main (mock path only — fastest, blocks regression)
#   - Nightly schedule (all 4 paths including auto_fallback)
#   - Release tags (mock + host + api, full baseline update)
#
# Block behavior:
#   - mock:   >+10% p95 regression → BLOCK PR
#   - host:   >+10% p95 regression → BLOCK release tag (informational on PR)
#   - api:    >+20% p95 regression → BLOCK release tag (informational on PR)
#   - auto_fallback: diagnostic only, never blocks
#
# Baseline source: docs/reference/PERFORMANCE_BASELINE.json
# Re-collect:       python3 scripts/collect_baseline.py

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *"  # Nightly at 3AM UTC (after CI at 2AM)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-mock:
    name: Perf gate — Mock path (PR-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    env:
      DEVSQUAD_LLM_BACKEND: mock
      DEVSQUAD_API_AUTH_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Verify baseline file present
        run: |
          test -f docs/reference/PERFORMANCE_BASELINE.json || (
            echo "ERROR: PERFORMANCE_BASELINE.json missing — run scripts/collect_baseline.py"
            exit 1
          )

      - name: Run Mock path perf gate
        # Compare current run vs baseline; threshold enforced by compare_to_baseline
        run: |
          python -m pytest tests/test_perf_baseline.py tests/test_perf_baseline_ci_gate.py -v \
            --timeout=60 \
            -m "unit"

      - name: Anti-ghost check (V4.5.2)
        run: |
          python scripts/check_module_activation.py

  perf-full:
    name: Perf gate — All paths (release-tag-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DEVSQUAD_LLM_BACKEND: auto
      DEVSQUAD_API_AUTH_DISABLED: "1"
      DEVSQUAD_OPENAI_API_KEY: ${{ secrets.DEVSQUAD_OPENAI_API_KEY }}
      DEVSQUAD_OPENAI_BASE_URL: ${{ secrets.DEVSQUAD_OPENAI_BASE_URL }}
      DEVSQUAD_OPENAI_MODEL: ${{ secrets.DEVSQUAD_OPENAI_MODEL }}
      MOKA_API_KEY: ${{ secrets.MOKA_API_KEY }}
      MOKA_API_BASE: ${{ secrets.MOKA_API_BASE }}
      MOKA_MODEL: ${{ secrets.MOKA_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-timeout openai httpx2
      - name: Run full perf gate (mock + host + api)
        # On release tags, all 3 blocking paths are validated.
        # auto_fallback is diagnostic-only (recorded but not blocking).
        run: |
          python -m pytest tests/test_perf_baseline.py tests/test_perf_baseline_ci_gate.py \
            tests/test_host_bridge_unit.py \
            tests/test_fallback_fuse.py \
            -v --timeout=120 -m "unit"
      - name: Re-collect baseline for next release (informational)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Run collector but don't overwrite committed baseline automatically.
          # Maintainer must review the diff and commit manually.
          python scripts/collect_baseline.py > /tmp/baseline-diff.txt
          echo "Baseline regeneration output:"
          cat /tmp/baseline-diff.txt
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: |
            /tmp/baseline-diff.txt
          retention-days: 14
