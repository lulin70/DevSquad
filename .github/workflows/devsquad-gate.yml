name: devsquad-gate

# V4.8.0 P1-R1: reusable deterministic PR review gate (zero LLM, zero keys,
# zero secrets by default). Consumers call this workflow from their own
# pull_request wrapper (one line: `uses: lulin70/DevSquad/.github/workflows/
# devsquad-gate.yml@v4`). Design doc: docs/planning/V4.8.0_R1_devsquad_gate_DESIGN.md
#
# Verdict semantics (design §5, fail-closed):
#   findings > 0 hitting fail-on         -> fail    -> exit 1
#   findings = 0                         -> pass    -> exit 0
#   gate.json missing / unparseable,
#   pip install failed, diff fetch failed -> blocked -> exit 2
#   empty diff                           -> pass    -> exit 0 (coverage 0/0)
#
# The verdict is driven by the JSON `lifecycle_findings` of `devsquad review
# --diff-file` (design §3); the CLI exit code is only a blocked fallback.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      devsquad-version:
        type: string
        default: "4.9.0"
        description: "PyPI version of devsquad to install (bump consciously at release)"
      task:
        type: string
        default: "devsquad-gate: deterministic PR review"
      include:
        type: string
        default: ""
        description: "Comma-separated path filter (empty = no filter)"
      exclude:
        type: string
        default: ""
      fail-on:
        type: string
        default: "break"
        description: "break = BREAK-class findings fail; any = any finding fails"
      preview-only:
        type: boolean
        default: false
        description: "Pricing mode: only run --preview, comment the summary, exit 0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One gate run per PR at a time: consecutive pushes do not burn runners.
    concurrency:
      group: devsquad-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Inputs ride env vars (never interpolated into the shell directly).
      GATE_TASK: ${{ inputs.task }}
      GATE_INCLUDE: ${{ inputs.include }}
      GATE_EXCLUDE: ${{ inputs.exclude }}
    steps:
      - name: Check out the PR merge ref
        # The merge ref is exactly what GitHub would test on merge.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install devsquad CLI
        id: install
        # A failed install must not red the job directly: the verdict step
        # turns it into an honest blocked comment (exit 2) instead.
        continue-on-error: true
        run: pip install devsquad==${{ inputs.devsquad-version }}

      - name: Fetch the PR diff
        # Private consumer repos need an authenticated diff fetch (T-3 trial
        # finding 2026-10-22). The REST pulls endpoint returns the diff
        # directly (no cross-host redirect, which would strip the auth
        # header). URL parts come from the event payload (TLS, design §6);
        # the token rides an env var, never the shell directly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -o /tmp/pr.diff \
            || echo "1" > /tmp/fetch-failed

      - name: Run deterministic review
        # The verdict below is findings-driven; the CLI exit code only
        # matters as a blocked fallback (a crash leaves gate.json missing).
        # --include/--exclude take space-separated patterns on ONE flag
        # (nargs="+"; a repeated flag would be overwritten, not appended).
        continue-on-error: true
        run: |
          if [ -f /tmp/fetch-failed ] || [ ! -s /tmp/pr.diff ]; then
            exit 0
          fi
          ARGS=(--diff-file /tmp/pr.diff --task "$GATE_TASK" --format json)
          INC=()
          IFS=',' read -ra RAW_INC <<< "$GATE_INCLUDE"
          for p in "${RAW_INC[@]}"; do if [ -n "$p" ]; then INC+=("$p"); fi; done
          if [ ${#INC[@]} -gt 0 ]; then ARGS+=(--include "${INC[@]}"); fi
          EXC=()
          IFS=',' read -ra RAW_EXC <<< "$GATE_EXCLUDE"
          for p in "${RAW_EXC[@]}"; do if [ -n "$p" ]; then EXC+=("$p"); fi; done
          if [ ${#EXC[@]} -gt 0 ]; then ARGS+=(--exclude "${EXC[@]}"); fi
          if [ "${{ inputs.preview-only }}" = "true" ]; then ARGS+=(--preview); fi
          devsquad review "${ARGS[@]}" > /tmp/gate.json

      - name: Compute verdict and comment body
        # Single decision point: reads the install outcome, the fetch state,
        # and gate.json; writes /tmp/comment.md (protocol v1) and the final
        # exit code. Only whitelisted fields ever enter the comment (design §6).
        run: |
          python - <<'PYEOF'
          import json
          import os

          fail_on = "${{ inputs.fail-on }}"
          run_url = ("${{ github.server_url }}/${{ github.repository }}"
                     "/actions/runs/${{ github.run_id }}")
          install_ok = "${{ steps.install.outcome }}" == "success"
          preview_only = "${{ inputs.preview-only }}" == "true"

          try:
              diff_text = open("/tmp/pr.diff", encoding="utf-8").read()
          except OSError:
              diff_text = ""
          reviewed = len({line[6:] for line in diff_text.splitlines()
                          if line.startswith("+++ b/")})

          verdict = failure_class = exit_code = None
          break_n = vuln_n = total = 0
          reason = ""
          if not install_ok:
              verdict, failure_class, exit_code, reason = (
                  "blocked", "environment_blocked", 2, "devsquad install failed")
          elif os.path.exists("/tmp/fetch-failed"):
              verdict, failure_class, exit_code, reason = (
                  "blocked", "environment_blocked", 2, "diff fetch failed")
          elif not diff_text.strip():
              # Empty diff (PR with no changes) is an honest pass with 0/0.
              verdict, failure_class, exit_code = "pass", "n/a", 0
          else:
              try:
                  gate = json.load(open("/tmp/gate.json", encoding="utf-8"))
              except Exception:
                  verdict, failure_class, exit_code, reason = (
                      "blocked", "environment_blocked", 2,
                      "gate.json missing or unparseable")
              else:
                  if preview_only:
                      verdict, failure_class, exit_code = "pass", "n/a", 0
                  else:
                      findings = gate.get("lifecycle_findings", [])
                      break_n = sum(1 for f in findings
                                    if str(f.get("category", "")).startswith("BREAK"))
                      vuln_n = sum(1 for f in findings
                                   if str(f.get("category", "")).startswith("VULN"))
                      total = len(findings)
                      if total == 0:
                          verdict, failure_class, exit_code = "pass", "n/a", 0
                      elif fail_on == "any" or break_n > 0:
                          verdict, failure_class, exit_code = (
                              "fail", "product_failed", 1)
                      else:
                          verdict, failure_class, exit_code = "pass", "n/a", 0

          summary = ""
          if preview_only and verdict != "blocked" and diff_text.strip():
              try:
                  gate = json.load(open("/tmp/gate.json", encoding="utf-8"))
                  summary = ("preview: candidates={cand} retained={ret} "
                             "excluded={exc} bundles={bun}").format(
                      cand=gate.get("candidate_count", "n/a"),
                      ret=gate.get("retained_count", "n/a"),
                      exc=gate.get("excluded_count", "n/a"),
                      bun=gate.get("bundle_count", "n/a"))
              except Exception:
                  summary = "preview: unavailable"

          lines = [
              "## devsquad-gate 审查结果",
              "<!-- devsquad-gate v1 -->",
              "",
              f"Run: {run_url}",
              "",
              f"- verdict: {verdict}",
              f"- findings: BREAK {break_n} / VULN {vuln_n} / total {total}",
              f"- failure_class: {failure_class}",
              f"- coverage: {reviewed} reviewed / 0 dropped (by gate)",
          ]
          if reason:
              lines += ["", f"- blocked_reason: {reason}"]
          if summary:
              lines += ["", summary]
          with open("/tmp/comment.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          with open("/tmp/gate-exit", "w") as fh:
              fh.write(str(exit_code))
          PYEOF

      - name: Post the PR comment
        # The comment is the disclosure face, never a gate itself: a failed
        # comment must not change the verdict (design §5 last row).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/comment.md \
            --edit-last --create-if-none

      - name: Exit by verdict
        run: exit "$(cat /tmp/gate-exit)"
