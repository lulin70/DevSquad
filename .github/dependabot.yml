# Dependabot Configuration for DevSquad
# Security updates stay visible and require the protected main-branch review path.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # mcp must stay OUT of the group: Dependabot does not honor
          # update-level `ignore` rules for grouped updates (known upstream
          # defect — PR #97 was rejected 2026-11-17, yet the identical
          # `mcp>=1,<3` widening came back inside grouped PR #98).
          - "mcp"
    ignore:
      # mcp 2.x removed `mcp.server.fastmcp` (scripts/mcp_server.py:50) and the
      # code has not migrated yet. Keep the `mcp>=1,<2` pin until the FastMCP
      # migration lands (adjudicated in PR #93; DR-2026-11-16 lesson: verify
      # API compatibility before letting dependabot widen upper bounds).
      # ALL update types are ignored: the semver-major filter proved
      # unreliable for constraint-widening PRs — #97 (grouped) and #99
      # (standalone, created 2 minutes after PR #98 merged) both slipped
      # through. 1.x minor/patch bumps ride along with the FastMCP migration.
      - dependency-name: "mcp"
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
      - "review-required"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
      - "security-review"
