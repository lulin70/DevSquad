# Dependabot Configuration for DevSquad
# Security updates stay visible and require the protected main-branch review path.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # mcp 2.x removed `mcp.server.fastmcp` (scripts/mcp_server.py:50) and the
      # code has not migrated yet. Keep the `mcp>=1,<2` pin until the FastMCP
      # migration lands (adjudicated in PR #93; DR-2026-11-16 lesson: verify
      # API compatibility before letting dependabot widen upper bounds).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
      - "review-required"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
      - "security-review"
