# Dependabot Configuration for DevSquad
# Security updates stay visible and require the protected main-branch review path.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      python-dependencies:
        patterns:
          - "*"
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
      - "review-required"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    reviewers:
      - "lulin70"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
      - "security-review"
